<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171a1d">
    <meta name="description" content="CrewCut is coming soon.">
    <title>CrewCut — Coming Soon</title>
    <link rel="icon" href="assets/crewcut-mark.png">
    <style>
      :root {
        --ink: #171a1d;
        --paper: #f4f0e8;
        --amber: #f4a62a;
        --grid: rgba(244, 240, 232, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        color: var(--paper);
        background:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px),
          radial-gradient(circle at 48% 42%, #22272b 0, var(--ink) 54%, #111416 100%);
        background-size: clamp(8rem, 16vw, 13rem) clamp(8rem, 16vw, 13rem),
          clamp(8rem, 16vw, 13rem) clamp(8rem, 16vw, 13rem),
          auto;
        font-family: Arial, Helvetica, sans-serif;
      }

      body::before {
        position: fixed;
        inset: 0 auto 0 0;
        width: clamp(1rem, 3.3vw, 3.35rem);
        background: var(--amber);
        content: "";
      }

      main {
        position: relative;
        display: grid;
        min-height: 100svh;
        padding: clamp(2.25rem, 6vw, 6rem) clamp(1.75rem, 8vw, 8.5rem)
          clamp(2rem, 5vw, 4.5rem) clamp(3.25rem, 10vw, 10rem);
        grid-template-rows: 1fr auto;
        isolation: isolate;
      }

      main::before,
      main::after {
        position: absolute;
        z-index: -1;
        width: clamp(3rem, 6vw, 5rem);
        aspect-ratio: 1;
        border: 1px solid rgba(244, 240, 232, 0.45);
        border-radius: 50%;
        content: "";
      }

      main::before {
        top: 12%;
        right: 10%;
      }

      main::after {
        right: 11%;
        bottom: 13%;
      }

      .hero {
        display: flex;
        align-items: center;
      }

      h1 {
        max-width: 9ch;
        margin: 0;
        font-size: clamp(4rem, 12vw, 10.5rem);
        font-weight: 900;
        letter-spacing: -0.075em;
        line-height: 0.78;
        text-transform: uppercase;
      }

      h1 span {
        display: block;
        margin-top: clamp(2rem, 5vw, 4rem);
        color: var(--amber);
        font-size: clamp(1.15rem, 3vw, 2.55rem);
        letter-spacing: 0.01em;
        line-height: 1.05;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2rem;
        padding-top: 3rem;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: clamp(0.8rem, 2vw, 1.35rem);
        color: var(--paper);
        font-size: clamp(1rem, 2.25vw, 1.75rem);
        font-weight: 900;
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }

      .brand img {
        width: clamp(5.25rem, 12vw, 9rem);
        height: auto;
        display: block;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.75rem 1.5rem;
      }

      a {
        color: var(--paper);
        font-size: clamp(0.9rem, 1.5vw, 1.05rem);
        font-weight: 700;
        text-decoration-color: var(--amber);
        text-decoration-thickness: 2px;
        text-underline-offset: 0.35em;
      }

      a:hover,
      a:focus-visible {
        color: var(--amber);
      }

      a:focus-visible {
        outline: 2px solid var(--paper);
        outline-offset: 0.35rem;
      }

      @media (max-width: 680px) {
        main {
          padding-left: 3.4rem;
        }

        h1 {
          font-size: clamp(4rem, 20vw, 6.7rem);
          line-height: 0.82;
        }

        footer {
          align-items: flex-start;
          flex-direction: column;
          gap: 1.5rem;
        }

        nav {
          justify-content: flex-start;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        a {
          transition: color 160ms ease;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="headline">
        <h1 id="headline">
          Hello,<br>world.
          <span>CrewCut is coming soon.</span>
        </h1>
      </section>

      <footer>
        <div class="brand">
          <img src="assets/crewcut-mark.png" alt="" width="512" height="512">
          <span>CrewCut</span>
        </div>

        <nav aria-label="Contact">
          <a href="mailto:hello@crewcut.live">hello@crewcut.live</a>
          <a href="https://www.instagram.com/crewcut.live/" rel="me noopener noreferrer">Instagram</a>
        </nav>
      </footer>
    </main>
  </body>
</html>
